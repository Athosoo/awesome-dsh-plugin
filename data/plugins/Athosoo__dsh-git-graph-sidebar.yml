description:
  en: 'A Git graph plugin for DSH that lives in a dsh-better-sidebar tab (optionally as its own page in the conversation main area): it lists the repositories up to three levels under the workspace (200 max) as a tree and renders the selected history as an SVG lane graph - cross-lane curves, merge diamonds, ref badges, terminus notches, zoom and export. Its point is conventions that actually hold: choose one of seven built-in frameworks (including a Worktree flow), add your own templates or hide built-ins; the chosen document is written into the repo and injected into every model step, whose last 20 commit messages are checked against its rules (subject length, type prefix, language, casing, trailing period, imperative mood, AI attribution), and conflicting documents are listed for a human call before a one-click merge. Forked from @linxin666/dsh-client-ui-git-graph 0.4.8; both own the /git prefix, so pick one. Disk writes happen only for git init, conventions/templates and the worktree dialog; everything else is read-only.'
  zh: 'DSH 的 Git 图谱插件，挂在 dsh-better-sidebar 页签里（可选开成对话主区域的一页）：扫描工作区三层内的仓库（最多 200 个）并树状列出，提交图画成 SVG 泳道图——跨泳道曲线、合并菱形、ref 徽章、首尾短槽、缩放与导出。核心是让规范真生效：七套内置框架（含 Worktree 工作流）任选，也能自建模板、隐藏内置；选中的规范写进仓库并注入每个模型步骤，最近 20 条提交逐条体检（标题长度、type、语言、大小写、句号、祈使句、AI 署名）；多份规范冲突时逐条列出、先问再合并。分叉自 @linxin666/dsh-client-ui-git-graph 0.4.8，与上游同占 /git 前缀，只能二选一；写盘只发生在 git init、规范/模板与 worktree 对话框，其余只读。'
